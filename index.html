<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서희원 | Mercedes-Benz 강서목동전시장</title>
  <meta name="description" content="메르세데스-벤츠 강서목동전시장 서희원 부장 디지털 명함 | 시승, 견적, 금융 상담, 빠른 출고 안내" />

  <meta property="og:title" content="서희원 | Mercedes-Benz" />
  <meta property="og:description" content="고객님의 라이프스타일에 가장 잘 맞는 메르세데스-벤츠를 정성껏 안내해드립니다." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="profile-image.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #00163a;
      --navy-deep: #000f2b;
      --ink: #071127;
      --line: rgba(255, 255, 255, 0.16);
      --silver: #d9dee8;
      --white: #ffffff;
      
      /* 지도 버튼 브랜드 컬러 추가 */
      --tmap: #0085FF;
      --kakao: #FEE500;
      --naver: #03C75A;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.10), transparent 28%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-deep) 100%);
    }

    .card {
      width: 100%;
      max-width: 430px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(0, 18, 49, 0.86);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .hero {
      padding: 34px 28px 26px;
    }

    .topline {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .role {
      color: var(--silver);
      font-size: 15px;
      font-weight: 700;
    }

    .showroom {
      margin: 0;
      color: var(--silver);
      font-size: 15px;
      font-weight: 700;
    }

    .portrait-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 34px;
    }

    .portrait {
      width: min(58vw, 190px);
      aspect-ratio: 1 / 1.32;
      object-fit: cover;
      object-position: 48% 18%;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: #f3f3ef;
    }

    .message {
      margin: 28px 0 0;
      color: #eef2f8;
      font-size: 15px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .actions {
      display: grid;
      gap: 10px;
      padding: 0 28px 26px;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 13px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 750;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .cta:active {
      transform: translateY(1px);
    }

    .cta-primary {
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 12px 26px rgba(255, 255, 255, 0.13);
    }

    .cta-secondary {
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.06);
    }

    .cta:hover {
      transform: translateY(-2px);
    }

    .info {
      display: grid;
      gap: 0;
      background: var(--white);
      color: #19345d;
      font-size: 14px;
      font-weight: 700;
    }

    .info-row {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 12px;
      padding: 12px 18px;
      border-top: 1px solid #e7eaf0;
    }

    .info-row:first-child {
      border-top: 0;
    }

    .info a {
      color: #19345d;
      text-decoration: none;
      text-align: right;
      word-break: break-word;
    }

    /* 지도 섹션 스타일 추가 */
    .section {
      background: var(--white);
      padding: 24px 28px;
      border-top: 1px solid #e7eaf0;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8c9baf;
      margin-bottom: 16px;
    }

    .map-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding: 16px;
      background: #f8f9fb;
      border-radius: 12px;
    }

    .map-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--navy);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .map-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .map-text strong {
      font-size: 15px;
      color: #071127;
      font-weight: 750;
    }

    .map-text span {
      font-size: 13px;
      color: #5b6b83;
      word-break: keep-all;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .action-item:active {
      transform: scale(0.95);
    }

    .action-badge, .action-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 18px;
    }

    .action-icon {
      background: #eef2f8;
      color: #19345d;
    }

    .action-label {
      font-size: 12px;
      font-weight: 700;
      color: #5b6b83;
    }

    .trust {
      padding: 22px 28px 30px;
      color: #dfe5ef;
      font-size: 13px;
      line-height: 1.8;
      word-break: keep-all;
      background: transparent;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      .hero {
        padding: 32px 26px 24px;
      }

      h1 {
        font-size: 32px;
      }

      .portrait {
        width: 52vw;
        max-width: 188px;
      }

      .info-row {
        grid-template-columns: 112px 1fr;
        padding-inline: 18px;
      }

      .section {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="서희원 디지털 명함">
    <section class="hero">
      <div class="topline">
        <h1>서희원</h1>
        <span class="role">부장</span>
      </div>
      <p class="showroom">Mercedes-Benz 강서목동전시장</p>

      <div class="portrait-wrap">
        <img class="portrait" src="profile-image.png" alt="서희원 부장 프로필 이미지" />
      </div>

      <p class="message">
        고객님의 라이프스타일에 가장 잘 맞는 메르세데스-벤츠를 정직하고 신속하게 안내해드리겠습니다.
      </p>
    </section>

    <section class="actions" aria-label="빠른 상담">
      <a class="cta cta-primary" href="tel:01056621977">전화 상담 연결</a>
      <a class="cta cta-secondary" href="sms:01056621977">문자로 문의하기</a>
      <a class="cta cta-secondary" href="mailto:hwseo@kccauto.co.kr">이메일 보내기</a>
      <a class="cta cta-secondary" href="https://open.kakao.com/o/s0obhtvi" target="_blank" rel="noopener noreferrer">카카오톡 상담</a>
    </section>

    <section class="info" aria-label="연락처">
      <div class="info-row">
        <span>휴대전화 연결</span>
        <a href="tel:01056621977">010 5662 1977</a>
      </div>
      <div class="info-row">
        <span>이메일</span>
        <a href="mailto:hwseo@kccauto.co.kr">hwseo@kccauto.co.kr</a>
      </div>
    </section>

    <!-- 추가된 위치 및 지도 안내 섹션 -->
    <div class="section">
      <div class="section-title">LOCATION</div>
      <div class="map-info">
        <div class="map-pin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="map-text">
          <strong>벤츠 강서목동 전시장</strong>
          <span>서울 강서구 공항대로 665</span>
        </div>
      </div>
      <div class="action-grid">
        <button class="action-item" onclick="openTmap()">
          <div class="action-badge" style="background:var(--tmap);color:white;">T</div>
          <span class="action-label">티맵</span>
        </button>
        <button class="action-item" onclick="openKakaoMap()">
          <div class="action-badge" style="background:var(--kakao);color:#1a1a1a;">K</div>
          <span class="action-label">카카오맵</span>
        </button>
        <button class="action-item" onclick="openNaverMap()">
          <div class="action-badge" style="background:var(--naver);color:white;">N</div>
          <span class="action-label">네이버맵</span>
        </button>
        <button class="action-item" onclick="copyAddress()">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="action-label">주소 복사</span>
        </button>
      </div>
    </div>

    <section class="trust">
      시승 예약 · 맞춤 견적 상담 · 금융 프로그램 안내 · 빠른 출고 일정 확인까지 처음 상담부터 출고까지 책임감 있게 함께하겠습니다.
    </section>
  </main>

  <!-- 지도 앱 연결 및 주소 복사 기능을 위한 자바스크립트 추가 -->
  <script>
    const address = "서울 강서구 공항대로 665";

    function openTmap() {
      // 모바일 티맵 검색 결과로 이동
      window.open(`https://tmap.life/app/search/places?q=${encodeURIComponent(address)}`, '_blank');
    }

    function openKakaoMap() {
      // 카카오맵 검색 결과로 이동
      window.open(`https://map.kakao.com/link/search/${encodeURIComponent(address)}`, '_blank');
    }

    function openNaverMap() {
      // 네이버 지도 검색 결과로 이동
      window.open(`https://map.naver.com/v5/search/${encodeURIComponent(address)}`, '_blank');
    }

    function copyAddress() {
      // 클립보드에 주소 복사
      navigator.clipboard.writeText(address).then(() => {
        alert('전시장 주소가 복사되었습니다.\n내비게이션에 붙여넣기 해주세요!');
      }).catch(err => {
        alert('주소 복사를 지원하지 않는 브라우저입니다. 직접 주소를 복사해주세요.');
      });
    }
  </script>
</body>
</html>
