<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서희원 | Mercedes-Benz 강서목동전시장</title>
  <meta name="description" content="메르세데스-벤츠 강서목동전시장 서희원 부장 디지털 명함 | 시승, 견적, 금융 상담, 빠른 출고 안내" />

  <meta property="og:title" content="서희원 | Mercedes-Benz" />
  <meta property="og:description" content="고객님의 라이프스타일에 가장 잘 맞는 메르세데스-벤츠를 정성껏 안내해드립니다." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="profile-image.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #00163a;
      --navy-deep: #000f2b;
      --ink: #071127;
      --line: rgba(255, 255, 255, 0.16);
      --silver: #d9dee8;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.10), transparent 28%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-deep) 100%);
    }

    .card {
      width: 100%;
      max-width: 430px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(0, 18, 49, 0.86);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    .hero {
      padding: 34px 28px 26px;
    }

    .topline {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .role {
      color: var(--silver);
      font-size: 15px;
      font-weight: 700;
    }

    .showroom {
      margin: 0;
      color: var(--silver);
      font-size: 15px;
      font-weight: 700;
    }

    .portrait-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 34px;
    }

    .portrait {
      width: min(58vw, 190px);
      aspect-ratio: 1 / 1.32;
      object-fit: cover;
      object-position: 48% 18%;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: #f3f3ef;
    }

    .message {
      margin: 28px 0 0;
      color: #eef2f8;
      font-size: 15px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .actions {
      display: grid;
      gap: 10px;
      padding: 0 28px 26px;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 13px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 750;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .cta:active {
      transform: translateY(1px);
    }

    .cta-primary {
      color: var(--ink);
      background: var(--white);
      box-shadow: 0 12px 26px rgba(255, 255, 255, 0.13);
    }

    .cta-secondary {
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.06);
    }

    .cta:hover {
      transform: translateY(-2px);
    }

    .info {
      display: grid;
      gap: 0;
      background: var(--white);
      color: #19345d;
      font-size: 14px;
      font-weight: 700;
    }

    .info-row {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 12px;
      padding: 12px 18px;
      border-top: 1px solid #e7eaf0;
    }

    .info-row:first-child {
      border-top: 0;
    }

    .info a {
      color: #19345d;
      text-decoration: none;
      text-align: right;
      word-break: break-word;
    }

    .trust {
      padding: 22px 28px 30px;
      color: #dfe5ef;
      font-size: 13px;
      line-height: 1.8;
      word-break: keep-all;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      .hero {
        padding: 32px 26px 24px;
      }

      h1 {
        font-size: 32px;
      }

      .portrait {
        width: 52vw;
        max-width: 188px;
      }

      .info-row {
        grid-template-columns: 112px 1fr;
        padding-inline: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="서희원 디지털 명함">
    <section class="hero">
      <div class="topline">
        <h1>서희원</h1>
        <span class="role">부장</span>
      </div>
      <p class="showroom">Mercedes-Benz 강서목동전시장</p>

      <div class="portrait-wrap">
        <img class="portrait" src="profile-image.png" alt="서희원 부장 프로필 이미지" />
      </div>

      <p class="message">
        고객님의 라이프스타일에 가장 잘 맞는 메르세데스-벤츠를 정직하고 신속하게 안내해드리겠습니다.
      </p>
    </section>

    <section class="actions" aria-label="빠른 상담">
      <a class="cta cta-primary" href="tel:01056621977">전화 상담 연결</a>
      <a class="cta cta-secondary" href="sms:01056621977">문자로 문의하기</a>
      <a class="cta cta-secondary" href="mailto:hwseo@kccauto.co.kr">이메일 보내기</a>
      <a class="cta cta-secondary" href="https://open.kakao.com/" target="_blank" rel="noopener noreferrer">카카오톡 상담</a>
    </section>

    <section class="info" aria-label="연락처">
      <div class="info-row">
        <span>휴대전화 연결</span>
        <a href="tel:01056621977">010 5662 1977</a>
      </div>
      <div class="info-row">
        <span>이메일</span>
        <a href="mailto:hwseo@kccauto.co.kr">hwseo@kccauto.co.kr</a>
      </div>
    </section>

    <section class="trust">
      시승 예약 · 맞춤 견적 상담 · 금융 프로그램 안내 · 빠른 출고 일정 확인까지 처음 상담부터 출고까지 책임감 있게 함께하겠습니다.
    </section>
  </main>
</body>
</html>
